<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Someone Special ❤️</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.container {
  position: relative;
  z-index: 2;
  width: 90%;
  max-width: 500px;
}

.card {
  backdrop-filter: blur(15px);
  background: rgba(255, 255, 255, 0.15);
  padding: 35px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  animation: fadeIn 1s ease forwards;
}

h1 span {
  color: #fff;
  text-shadow: 0 0 10px #fff, 0 0 20px #ff4b6e;
}

button {
  padding: 10px 25px;
  border-radius: 25px;
  border: none;
  cursor: pointer;
  margin: 10px;
  font-size: 15px;
  transition: 0.3s;
}

.yes {
  background: white;
  color: #ff4b6e;
}

.no {
  background: #ff4b6e;
  color: white;
  position: absolute;
}

.hidden { display: none; }

.letter {
  margin-top: 20px;
  min-height: 80px;
}

.secret {
  margin-top: 20px;
  display: none;
  font-weight: bold;
}

.countdown {
  margin-top: 15px;
  font-size: 14px;
  opacity: 0.9;
}

.final-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #ff4b6e, #ff758c);
  display: none;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-size: 28px;
  padding: 20px;
  z-index: 5;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Floating hearts */
.heart {
  position: absolute;
  font-size: 18px;
  animation: floatUp 6s linear infinite;
  opacity: 0.7;
}

@keyframes floatUp {
  0% { transform: translateY(100vh); opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>
<body>

<div class="container">

  <!-- PAGE 1 -->
  <div class="card" id="page1">
    <h2>I know I'm a bit late and I'm really sorry 🥺</h2>
    <h1>But will you be my Valentine, <span>HER NAME</span>? ❤️</h1>
    <button class="yes" onclick="showPage2()">Yes ❤️</button>
    <button class="no" id="noBtn">No 💔</button>
  </div>

  <!-- PAGE 2 -->
  <div class="card hidden" id="page2">
    <h1>Ohhh so you're interested in me? 😏❤️</h1>

    <div class="letter" id="typedLetter"></div>

    <button class="yes" onclick="showSecret()">Click only if you love me 😌</button>

    <div class="secret" id="secretMessage">
      I already knew you would ❤️
      <br><br>
      <button class="yes" onclick="showFinal()">One Last Thing...</button>
    </div>

    <div class="countdown" id="countdown"></div>
  </div>

</div>

<div class="final-screen" id="finalScreen">
  Thank you for choosing me ❤️<br>
  I’ll always choose you.
</div>

<script>
/* NO BUTTON BEHAVIOR */
const noBtn = document.getElementById("noBtn");
let scale = 1;

function moveButton() {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
  scale *= 0.9;
  noBtn.style.transform = "scale(" + scale + ")";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", function(e){
  e.preventDefault();
  moveButton();
});

/* PAGE SWITCH */
function showPage2() {
  document.getElementById("page1").classList.add("hidden");
  document.getElementById("page2").classList.remove("hidden");
  launchConfetti();
  typeLetter();
}

/* CONFETTI */
function launchConfetti() {
  for (let i = 0; i < 30; i++) {
    createHeart();
  }
}

/* FLOATING HEARTS */
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 15) + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}
setInterval(createHeart, 500);

/* TYPING LETTER */
const message = "You make my world brighter in ways I can't explain. Every laugh, every moment, every memory with you means more than you know. I’m really lucky to have you. ❤️";
let index = 0;

function typeLetter() {
  if (index < message.length) {
    document.getElementById("typedLetter").innerHTML += message.charAt(index);
    index++;
    setTimeout(typeLetter, 40);
  }
}

/* SECRET */
function showSecret() {
  document.getElementById("secretMessage").style.display = "block";
}

/* FINAL SCREEN */
function showFinal() {
  document.getElementById("finalScreen").style.display = "flex";
}

/* COUNTDOWN */
function updateCountdown() {
  const now = new Date();
  const year = now.getMonth() > 1 || (now.getMonth() === 1 && now.getDate() > 14)
    ? now.getFullYear() + 1
    : now.getFullYear();
  const valentine = new Date(`February 14, ${year} 00:00:00`);
  const diff = valentine - now;

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);

  document.getElementById("countdown").innerText =
    "Countdown to our next Valentine's Day ❤️: " +
    days + " days " + hours + " hours " + minutes + " minutes";
}
setInterval(updateCountdown, 1000);
updateCountdown();
</script>

</body>
</html>
